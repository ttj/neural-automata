# Half B / regime (1) configuration.
#
# Regime (1) trains the perception network (CNN) end-to-end from
# *sequence-level* accept/reject supervision via the soft forward
# algorithm. delta_theta is fixed (the hand-built DFA). The headline
# question: does per-image classification accuracy recover the
# per-image-supervised baseline (paper: 93.6% on EMNIST letters)?

regex: "[A-Za-z][A-Za-z]w"

# Per-class sample counts; total per-split = 2 * this (balanced).
num_train_per_class: 400      # -> 800 train examples
num_val_per_class: 100        # -> 200 val examples
num_test_per_class: 100       # -> 200 test examples

# Held-out single-image EMNIST test set for per-image top-1 accuracy.
per_image_n_per_class: 50      # -> 1300 single-image examples

# Optimizer.
optimizer: "Adam"
learning_rate: 1.0e-3
weight_decay: 0.0
batch_accumulate: 16
grad_clip_norm: 1.0

# Training schedule.
epochs: 20

# Reproducibility.
seed: 42

# Filesystem locations (relative to the repo root).
emnist_root: "data/EMNIST"
data_cache_dir: "experiments/halfb/regime1/_data_cache"
