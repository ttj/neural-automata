[project]
name = "nsa"
version = "0.2.0"
description = "Neurosymbolic finite and pushdown automata with end-to-end trainable runtime"
requires-python = ">=3.10"
dependencies = [
    "automata-lib>=9.2,<10",
    "torch>=2.1",
]

[project.optional-dependencies]
examples = [
    "torchvision>=0.16",
    "Pillow>=10",
    "numpy>=1.24",
    "rstr>=3.2",
]
vlm = [
    "ollama>=0.3",
]
experiments = [
    "PyYAML>=6",
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
]

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.2,<4"]
